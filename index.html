/* =====================================================================
   v1.3 — living aurora, weather, refined calendar
   ===================================================================== */
/* palettes — chosen by weather, at random, or fixed in Settings */
[data-au="sunset"]{--a1:#ff8a3d;--a2:#e8432c;--a3:rgba(255,150,60,.55);--b1:#3d3a2a;--b2:#154447;--b3:#102c33;--b4:#191d24}
[data-au="ocean"]{--a1:#3fa9ff;--a2:#5b5bff;--a3:rgba(80,220,255,.45);--b1:#1b2440;--b2:#0f3a56;--b3:#0b2433;--b4:#10151d}
[data-au="forest"]{--a1:#b6e36b;--a2:#2fb38a;--a3:rgba(240,200,90,.42);--b1:#2a3324;--b2:#16403a;--b3:#0e2a2a;--b4:#121916}
[data-au="dusk"]{--a1:#ff7ac6;--a2:#8a5cff;--a3:rgba(255,140,120,.45);--b1:#33223f;--b2:#2a1f4f;--b3:#171a35;--b4:#14141d}
[data-au="rose"]{--a1:#ffb38a;--a2:#ff5f7e;--a3:rgba(255,210,150,.5);--b1:#40282a;--b2:#4a2333;--b3:#2a1726;--b4:#191419}
[data-au="storm"]{--a1:#8fb4d9;--a2:#4b6cb7;--a3:rgba(160,200,230,.38);--b1:#2a3340;--b2:#1e2c3d;--b3:#141e2a;--b4:#11151b}
[data-au="snow"]{--a1:#e8f4ff;--a2:#9ec9ff;--a3:rgba(255,255,255,.42);--b1:#3a4553;--b2:#2c3a4c;--b3:#1c2634;--b4:#141a22}
[data-au="night"]{--a1:#6a7dff;--a2:#3b2fa0;--a3:rgba(150,120,255,.38);--b1:#1b1d3a;--b2:#141a33;--b3:#0e1224;--b4:#0b0d16}
/* slow drift: two GPU-composited layers, no JS, no network */
.au-l{position:absolute;inset:-35%;z-index:0;pointer-events:none;will-change:transform;
  background:radial-gradient(34% 30% at 72% 22%,var(--a1),transparent 70%),radial-gradient(30% 26% at 28% 16%,var(--a2),transparent 70%),radial-gradient(40% 34% at 18% 58%,var(--a3),transparent 72%);
  animation:auDrift 28s ease-in-out infinite alternate}
.aurora::before{content:"";position:absolute;inset:-30%;z-index:0;pointer-events:none;will-change:transform;
  background:radial-gradient(26% 22% at 78% 72%,color-mix(in oklab,var(--a2) 55%,transparent),transparent 70%),radial-gradient(22% 20% at 40% 40%,color-mix(in oklab,var(--a1) 35%,transparent),transparent 70%);
  animation:auDrift2 37s ease-in-out infinite alternate}
@keyframes auDrift{0%{transform:translate3d(-4%,-3%,0) rotate(0) scale(1)}50%{transform:translate3d(5%,4%,0) rotate(9deg) scale(1.12)}100%{transform:translate3d(-3%,6%,0) rotate(-7deg) scale(1.05)}}
@keyframes auDrift2{0%{transform:translate3d(6%,4%,0) scale(1.1)}100%{transform:translate3d(-7%,-5%,0) scale(.95) rotate(12deg)}}
.au-paused .au-l,.au-paused::before{animation-play-state:paused}
:where(.aurora) > :not(.au-l){position:relative;z-index:1}
.cap-q,.cap-k{transition:opacity .38s var(--ease),transform .38s var(--ease)}
.cap-q.out,.cap-k.out{opacity:0;transform:translateY(6px)}
.capture .chip-t.spin svg{animation:spin .6s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}

/* settings palette picker */
.au-picks{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.au-pick{width:34px;height:34px;border-radius:50%;border:2px solid transparent;transition:transform .2s var(--spring)}
.au-pick.aurora{border-radius:50%}
.au-pick.aurora::before,.au-pick.aurora::after{display:none}
.au-pick.on{border-color:var(--text);transform:scale(1.08)}
.au-pick.auto{width:auto;padding:0 14px;height:34px;border-radius:var(--r-pill);background:var(--surface-2);font-size:var(--t-sub)}
.au-pick.auto.on{background:var(--text);color:var(--text-inv)}

/* Today hero: full weekday + weather */
.today-hero{align-items:end}
.hero-l{min-width:0}
.day-big{white-space:nowrap}
.wx-slot{margin-top:10px;min-height:34px}
.wx{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-align:left;border-radius:var(--r-pill);transition:opacity .2s,transform .2s var(--spring);animation:viewIn .5s var(--ease)}
.wx:active{transform:scale(.97)}
.wx-icon svg.i{width:30px;height:30px;stroke-width:1.8;color:var(--accent)}
.wx-icon b{font-size:var(--t-h1);font-weight:500;letter-spacing:-.02em}
.wx-icon span{display:flex;flex-direction:column;font-size:var(--t-sub);color:var(--text-2);line-height:1.25}
.wx-icon small{font-size:var(--t-cap);color:var(--text-3)}
.wx-text{font-size:var(--t-h2);color:var(--text-2);letter-spacing:-.01em}
.wx-text b{color:var(--text);font-weight:600}
.wx-ask{height:34px;padding:0 14px;background:var(--surface);border:1px solid var(--line);font-size:var(--t-sub);color:var(--text-2)}
.wx-ask svg.i{width:16px;height:16px}

/* metrics are shortcuts */
.metrics{gap:6px}
.mt{display:inline-flex;align-items:center;gap:7px;padding:7px 10px 7px 8px;border-radius:var(--r-pill);text-decoration:none;color:var(--text);transition:background .2s}
.mt > svg.i:first-child{color:var(--mc)}
.mt:hover{background:var(--surface)}
.mt .go{width:14px;height:14px;color:var(--text-3);opacity:0;margin-left:-4px;transition:opacity .2s,transform .2s}
.mt:hover .go{opacity:1;transform:translateX(2px)}

/* week strip: swipe, refined day states */
.week{grid-template-columns:28px minmax(0,1fr) 28px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wk-track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;will-change:transform}
.wd{padding:8px 0 7px}
.wd .n{font-size:var(--t-body);font-weight:500;width:auto;height:auto;outline:0!important}
.wd.sun .w{color:var(--c-red);opacity:.8}
.wd.is-today:not(.sel){background:color-mix(in oklab,var(--accent) 13%,transparent)}
.wd.is-today .n{color:var(--accent);font-weight:600}
.wd.sel{background:var(--text);color:var(--text-inv)}
.wd.sel .n{color:var(--text-inv)}
.wd.sel.is-today{background:var(--accent)}
.wd.sel.is-today .n,.wd.sel.is-today .w{color:#fff}
.wd .dt{display:none}
.dots{display:flex;justify-content:center;gap:3px;height:5px;margin-top:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--dc,var(--accent))}
.dots i.td{background:transparent;box-shadow:inset 0 0 0 1.3px var(--text-2)}
.dots i.done{opacity:.35}
.wd.sel .dots i.td{box-shadow:inset 0 0 0 1.3px var(--text-inv)}
.wd.sel.is-today .dots i{background:#fff}
.week-top .lbl{text-align:left;padding:4px 0}
.today-pill{color:var(--accent)}
@media (hover:none){.week .nav{display:none}.week{grid-template-columns:minmax(0,1fr)}}
.slide-in-r{animation:slideInR .32s var(--ease)}
.slide-in-l{animation:slideInL .32s var(--ease)}
@keyframes slideInR{from{transform:translateX(30%);opacity:0}}
@keyframes slideInL{from{transform:translateX(-30%);opacity:0}}

/* calendar — calm grid, soft tinted events, dots on phones */
.cal{padding:14px 12px 10px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cal-head{grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;padding:0 0 8px;font-size:var(--t-cap)}
.cal-head .sun{color:var(--c-red)}.cal-head .sat{color:var(--c-blue)}
.cal-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:0;will-change:transform}
.cd{min-width:0;min-height:108px;background:transparent;border-radius:14px;padding:6px 5px 8px;border-top:1px solid var(--line);gap:3px;align-items:stretch}
.cd:hover{background:var(--surface-2)}
.cd.sel{box-shadow:none;background:var(--surface-2)}
.cd .dn{align-self:center;width:30px;height:30px;font-size:var(--t-sub);font-weight:500;border-radius:10px;margin:0 0 3px;display:grid;place-items:center;transition:background .2s,color .2s}
.cd.sun .dn{color:var(--c-red)}
.cd.today .dn{background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent);font-weight:600}
.cd.sel .dn{background:var(--text);color:var(--text-inv)}
.cd.today.sel .dn{background:var(--accent);color:#fff}
.cd.out{opacity:.32}
.cd .evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.ev{display:flex;align-items:center;gap:5px;min-width:0;font-size:var(--t-cap);line-height:1.35;padding:2px 7px;border-radius:7px;background:color-mix(in oklab,var(--evc,var(--accent)) 17%,transparent);color:var(--text);white-space:nowrap;overflow:hidden}
.ev .x{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .t{color:var(--text-2);font-variant-numeric:tabular-nums;flex:none;margin:0}
.ev.task{background:transparent;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.ev.task::before{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.4px currentColor;flex:none}
.ev.task.done{opacity:.55;text-decoration:line-through}
.ev-more{font-size:var(--t-cap);color:var(--text-3);padding-left:6px}
.cd .dots{display:none}
.cal.week .week-cols{grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.wcol{min-width:0;background:transparent;border-radius:14px;border-left:1px solid var(--line);padding:8px 6px;min-height:360px}
.wcol:first-child{border-left:0}
.wcol:hover{background:var(--surface-2)}
.wcol.sel{box-shadow:none;background:var(--surface-2)}
.wcol .wh{flex-direction:column;align-items:flex-start;gap:0;margin-bottom:8px}
.wcol .wh b{font-size:var(--t-h2);font-weight:600;color:var(--text)}
.wcol .wh span{font-size:var(--t-cap);color:var(--text-3)}
.wcol.today .wh b{color:var(--accent)}
.wcol .evs{display:flex;flex-direction:column;gap:4px;min-width:0}
.wcol .ev{white-space:normal;align-items:flex-start;padding:5px 8px}
.wcol .ev .x{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wcol .none{font-size:var(--t-cap);color:var(--text-3)}
/* agenda timeline */
.ag-ev,.ag-td{display:grid;grid-template-columns:62px auto minmax(0,1fr);align-items:center;gap:12px}
.ag-time{display:flex;flex-direction:column;line-height:1.2;font-variant-numeric:tabular-nums}
.ag-time b{font-size:var(--t-sub);font-weight:600}
.ag-time small{font-size:var(--t-cap);color:var(--sheet-2)}
.ag-td .ag-time b{color:var(--sheet-2);font-weight:500}
.ag-bar{width:4px;height:30px;border-radius:2px;background:var(--evc,var(--accent))}
.ag-ev .at,.ag-td .at{font-size:var(--t-body)}
@media (max-width:900px){
  .cd{min-height:58px;padding:5px 1px 6px;align-items:center;border-radius:12px}
  .cd .evs{display:none}
  .cd .dots{display:flex;margin-top:0}
  .cd .dn{width:32px;height:32px;margin:0}
  .cal{padding:10px 6px 6px}
  .cal.week .week-cols{grid-template-columns:minmax(0,1fr)}
  .wcol{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;border-left:0;border-top:1px solid var(--line);min-height:0;padding:10px 6px}

/* phones: bigger menus */
@media (max-width:900px){
  :root{--t-body:16px}
  #sidebar .nav-item{padding:11px 12px;gap:14px}
  #sidebar .nav-item svg.i{width:22px;height:22px}
  #sidebar .sb-label{font-size:var(--t-sub)}
  #sidebar .sb-head{font-size:28px}
  .seg button{height:38px;padding:0 14px}
  .day-big{font-size:clamp(44px,12.5vw,64px)}
  .wx-icon b{font-size:var(--t-h2)}
  .mt{padding:6px 8px 6px 6px}
  .mt .go{opacity:.6}
}
/* donation: currency shown in the custom field */
.amt-custom .cur{font-style:normal;font-weight:500;color:var(--text-2);flex:none}
.amt-custom.on .cur{color:var(--text-inv)}
.amt-custom input{text-align:left}
@media (hover:none){.cd:hover,.wcol:hover,.wd:hover{background:transparent}.cd.sel,.wcol.sel{background:var(--surface-2)}.wd.is-today:not(.sel){background:color-mix(in oklab,var(--accent) 13%,transparent)}}
.ag-ev,.ag-td{grid-template-columns:76px auto minmax(0,1fr)}
.ag-time b,.ag-time small{white-space:nowrap}

/* =====================================================================
   v1.4 — one calm column: content never wider than a tablet
   ===================================================================== */
:root{--content:820px}
.wrap,.wrap[style]{max-width:var(--content)!important}
#topbar{max-width:calc(var(--content) + 56px);width:100%;margin:0 auto}
.today-grid{display:flex;flex-direction:column;gap:16px;margin-top:26px}

  .capture h2{font-size:clamp(30px,3.4vw,40px);max-width:600px}
}

/* ---------- aurora v2: a single soft diagonal light sweep, like a long-exposure sky ---------- */
.aurora{background:linear-gradient(180deg,var(--b2) 0%,var(--b2) 32%,var(--b3) 68%,var(--b4) 100%);clip-path:inset(0 round var(--r-xl));-webkit-mask-image:-webkit-radial-gradient(white,black)}
.ed-panel.aurora{clip-path:none;-webkit-mask-image:none}
.au-pick.aurora{clip-path:circle(50%)}
.au-l{inset:-45%;animation:auSweep 26s ease-in-out infinite alternate;
  background:
    linear-gradient(135deg,color-mix(in oklab,var(--b1) 85%,#000) 0%,transparent 22%),
    linear-gradient(205deg,var(--a1) 0%,color-mix(in oklab,var(--a1) 55%,var(--a2)) 12%,var(--a2) 24%,color-mix(in oklab,var(--a2) 0%,transparent) 46%)}
.aurora::before{inset:-40%;opacity:.55;animation:auSweep2 33s ease-in-out infinite alternate;
  background:linear-gradient(20deg,transparent 30%,color-mix(in oklab,var(--a3) 70%,transparent) 55%,transparent 80%)}
.aurora::after{opacity:.22}
@keyframes auSweep{0%{transform:translate3d(0,0,0) rotate(0deg) scale(1)}100%{transform:translate3d(-7%,5%,0) rotate(-6deg) scale(1.08)}}
@keyframes auSweep2{0%{transform:translate3d(-5%,6%,0) rotate(0deg)}100%{transform:translate3d(6%,-4%,0) rotate(8deg)}}
/* palettes: --a1 bright edge, --a2 warm body, --a3 soft secondary light, --b1 corner shade, --b2..b4 sky from top to bottom */
.aurora,[data-au="sunset"]{--a1:#f7963f;--a2:#e8402a;--a3:rgba(255,170,90,.35);--b1:#1d1517;--b2:#1d4446;--b3:#173033;--b4:#20252b}
[data-au="ocean"]{--a1:#62c3ff;--a2:#3a5bff;--a3:rgba(110,220,255,.32);--b1:#0d1424;--b2:#123c55;--b3:#0f2a3a;--b4:#141a22}
[data-au="forest"]{--a1:#d8e47a;--a2:#3fae7c;--a3:rgba(240,210,120,.3);--b1:#121810;--b2:#1a4038;--b3:#13302b;--b4:#171d1b}
[data-au="dusk"]{--a1:#ff8fc8;--a2:#8256ff;--a3:rgba(255,160,140,.32);--b1:#160f20;--b2:#2b2552;--b3:#1c1c3a;--b4:#17171f}
[data-au="rose"]{--a1:#ffc08f;--a2:#ff5876;--a3:rgba(255,215,170,.35);--b1:#1e1214;--b2:#3d2433;--b3:#2a1a27;--b4:#1b161b}
[data-au="storm"]{--a1:#a9c8e8;--a2:#5274bf;--a3:rgba(170,205,235,.28);--b1:#11151c;--b2:#223244;--b3:#182433;--b4:#14181e}
[data-au="snow"]{--a1:#ffffff;--a2:#9cc6ff;--a3:rgba(255,255,255,.3);--b1:#1a2029;--b2:#34465a;--b3:#243243;--b4:#181e27}
[data-au="night"]{--a1:#8c9bff;--a2:#4535b8;--a3:rgba(160,140,255,.28);--b1:#08091a;--b2:#16193a;--b3:#10132a;--b4:#0c0e18}
#editor.skin-capture .ed-panel{background:linear-gradient(180deg,var(--b2) 0%,var(--b2) 30%,var(--b3) 65%,var(--b4) 100%)}
#editor.skin-capture .ed-panel > .au-l{inset:-45%}

/* editor header: Cancel · status … Save/Done */
.ed-cancel{color:var(--text-2);padding:0 12px}
.ed-cancel:hover{color:var(--text)}
#editor.skin-capture .ed-cancel{color:rgba(255,255,255,.85)}
/* the question is a hint, not part of your text: small, labelled, and it steps aside once you start */
.ed-prompt{display:flex;align-items:flex-start;gap:8px;font-size:var(--t-sub)!important;line-height:1.5!important;letter-spacing:0!important;color:var(--text-2);margin:2px 0 12px!important;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);opacity:1!important;max-height:80px;overflow:hidden;transition:max-height .3s var(--ease),opacity .25s,margin .3s,padding .3s}
.ed-prompt svg.i{width:16px;height:16px;flex:none;margin-top:2px;opacity:.8}
#editor.typing .ed-prompt,#editor.typing-title .ed-prompt,.kb-open .ed-prompt,#editor.has-text .ed-prompt{max-height:0;opacity:0!important;padding-top:0;padding-bottom:0;margin:0!important}
.ed-typesel{display:flex;flex-wrap:wrap;gap:6px}
.ed-typesel button{flex-direction:row;gap:6px;padding:0 12px;height:34px;font-size:var(--t-sub)}
.ed-typesel button svg.i{width:16px;height:16px}
@media (max-width:900px){.ed-typesel span{font-size:var(--t-sub)}}
.today-grid{align-items:stretch}.today-grid > .col > *{width:100%}

/* ---------- Today header: weekday • date/year lockup → weather → greeting → status ---------- */

.today-v .statement{font-size:clamp(22px,2.7vw,30px);line-height:1.3;letter-spacing:-.025em;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;margin-top:4px}

.tg-in .sh-day b{color:var(--text);font-weight:600}
.tg-in .sh-add{display:flex;gap:4px;flex:none}

/* ---------- aurora v3: flowing curtains + a slowly turning prism ---------- */
.aurora,[data-au="sunset"]{--p1:#ffd36b;--p2:#ff5fa2}
[data-au="ocean"]{--p1:#5ef0d0;--p2:#b07cff}
[data-au="forest"]{--p1:#7ef0c8;--p2:#ffd36b}
[data-au="dusk"]{--p1:#6fd3ff;--p2:#ffb36b}
[data-au="rose"]{--p1:#ffe08a;--p2:#b48cff}
[data-au="storm"]{--p1:#9ff0ff;--p2:#c1a6ff}
[data-au="snow"]{--p1:#c9f0ff;--p2:#e2c6ff}
[data-au="night"]{--p1:#5ff0ff;--p2:#ff7ad9}
.au-l{inset:-50%;animation:auFlow 18s ease-in-out infinite alternate;
  background:
    radial-gradient(26% 20% at 32% 30%,var(--a1),transparent 70%),
    radial-gradient(30% 24% at 68% 26%,var(--a2),transparent 70%),
    radial-gradient(28% 26% at 56% 66%,var(--a3),transparent 72%),
    radial-gradient(22% 18% at 24% 70%,color-mix(in oklab,var(--p1) 70%,transparent),transparent 70%),
    radial-gradient(20% 16% at 78% 58%,color-mix(in oklab,var(--p2) 60%,transparent),transparent 70%)}
.au-l::before{content:"";position:absolute;left:8%;right:8%;top:22%;height:42%;pointer-events:none;mix-blend-mode:screen;opacity:.55;filter:blur(12px);
  background:repeating-linear-gradient(90deg,transparent 0 2.5%,color-mix(in oklab,var(--a1) 70%,transparent) 4.5%,transparent 7%,transparent 9%,color-mix(in oklab,var(--p1) 55%,transparent) 11%,transparent 14%,color-mix(in oklab,var(--p2) 45%,transparent) 16.5%,transparent 19.5%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 52%,transparent 100%);
  animation:auCurtain 14s ease-in-out infinite alternate}
.au-l::after{content:"";position:absolute;left:22%;top:18%;width:56%;aspect-ratio:1;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:.34;filter:blur(38px);
  background:conic-gradient(from 0deg,var(--a1),var(--p1),var(--a2),var(--p2),var(--a3),var(--a1));
  animation:auPrism 24s linear infinite}
.aurora::before{opacity:.5;animation:auSweep2 21s ease-in-out infinite alternate}
@keyframes auFlow{0%{transform:translate3d(-6%,-4%,0) rotate(-5deg) scale(1)}35%{transform:translate3d(4%,3%,0) rotate(4deg) scale(1.12)}70%{transform:translate3d(-2%,6%,0) rotate(-2deg) scale(1.05)}100%{transform:translate3d(6%,-3%,0) rotate(7deg) scale(1.16)}}
@keyframes auCurtain{0%{transform:skewX(-16deg) translateX(-7%) scaleY(.92)}50%{transform:skewX(-6deg) translateX(2%) scaleY(1.08)}100%{transform:skewX(-20deg) translateX(8%) scaleY(.96)}}
@keyframes auPrism{to{transform:rotate(360deg)}}
.au-paused .au-l::before,.au-paused .au-l::after{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.au-l,.au-l::before,.au-l::after,.aurora::before{animation:none!important}}

/* ---------- editor: one aurora composer, writing first ---------- */
#editor.skin-capture #edPin,#editor.skin-capture #edFav,#editor.skin-capture [data-ed="more"]{display:inline-flex}
#editor.skin-capture .ed-dates{display:inline}
#editor .ed-top{gap:8px;padding:12px 14px 10px;border-bottom:1px solid transparent;transition:border-color .25s}
#editor.drawer-open .ed-top{border-bottom-color:rgba(255,255,255,.1)}
.ed-optbtn{display:inline-flex;align-items:center;gap:8px;height:36px;max-width:min(46vw,360px);padding:0 12px 0 6px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.12);color:#fff;font-size:var(--t-sub);border:1px solid rgba(255,255,255,.14);transition:background .2s,color .2s,transform .2s var(--spring)}

.ed-optbtn:active{transform:scale(.96)}
.ed-optbtn .ob-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}

#editor.drawer-open .ed-drawer{background:rgba(8,10,14,.24);border-bottom:1px solid rgba(255,255,255,.1)}
.ed-dsec{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}
.ed-dl{font-size:var(--t-cap);color:var(--text-3);padding-top:9px;letter-spacing:.02em}

.ed-drawer .ed-meta{padding:0}

.ed-drow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid rgba(255,255,255,.1)}

.ed-dslot .ed-opt{position:static!important;border:1px solid rgba(255,255,255,.12)!important;border-radius:18px!important;box-shadow:none!important;background:rgba(255,255,255,.08)!important;max-height:none;padding:12px 14px 10px;animation:optIn .22s var(--ease)}

.ed-titlebox{flex:none;margin:0 0 16px;padding:10px 16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:background .2s,border-color .2s}
.ed-titlebox:focus-within{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
#editor .ed-title{font-size:clamp(19px,2.2vw,24px);line-height:1.3;padding:2px 0;letter-spacing:-.02em;font-weight:500}
#editor .ed-title::placeholder{color:rgba(255,255,255,.45)}
#editor .prose{flex:1;min-height:42vh;padding-bottom:12px;outline:0}
#editor .ed-prompt{flex:none}

#editor .au-l{transition:opacity .6s}
@media (max-width:900px){
  #editor .ed-top{padding:4px 10px 8px;gap:6px}
  .ed-optbtn{max-width:44vw;height:34px}

}

  "about.kicker": "About Kept",
  "about.title": "Light to remember. Built to keep.",
  "about.lead": "Kept is a small, independent company making one thing well: a calm, fast place for everything you would otherwise forget — free for everyone, funded by the people who use it.",
  "about.whatH": "What we make",
  "about.what": "Kept is a text-first memory tool. Thoughts, ideas, to-dos, events, where you put things and the people you know live in one place you can search in an instant. We obsess over the few seconds between remembering something and writing it down, because that is where most memories are lost.",

  "about.p3Body": "No images or heavy media — which keeps Kept fast, private and affordable to run.",
  "about.p4": "Leave whenever you like",

  "about.p5": "Fast first",

  "about.p6": "Made for everyone",

  "about.howH": "How we run",
  "about.how": "Kept has no investors to please and no ads to sell. Running costs — servers, database, backups and security — are covered by voluntary contributions, and we share how that money is used.",
  "about.f1": "You write",

  "about.f3Sub": "Contributions pay for servers and improvements.",
  "about.storyH": "Why Kept exists",
  "about.story": "Kept started from a simple frustration: the passport you put somewhere safe, the idea you had in the shower, the number a friend told you. Notes apps felt heavy, and to-do apps only cared about tasks. Kept is the place in between — quick enough for the smallest thought, organised enough to find it again years later.",

  "faq.q1": "Is Kept really free?",
  "faq.a1": "Yes. Every feature is free for everyone. Kept runs on voluntary contributions, and contributing never unlocks extra features.",
  "faq.q2": "Do I need an account?",
  "faq.a2": "No. You can use Kept on one device without an account. Sign in when you want backups and sync across devices — your device-only records can be moved into the account.",
  "faq.q3": "Can I install it on iPhone or iPad?",
  "faq.a3": "Yes (iOS 16.4 or later). In Safari tap Share → “Add to Home Screen” → “Add”. Settings → App → “How to install” shows the steps with pictures.",
  "faq.q4": "Does it work offline?",
  "faq.a4": "Yes. Everything is saved on your device first and syncs automatically when you’re back online.",
  "faq.q5": "How do I style just one word?",
  "faq.a5": "Select the word and tap a tool — bold, underline, colour, highlight or size. With nothing selected, the style applies to whatever you type next.",
  "faq.q6": "What’s the difference between Quick capture and New record?",
  "faq.a6": "They are the same editor. Quick capture opens it in the colourful style with a question to get you started and a type picker at the top; New record opens the plain editor.",
  "faq.q7": "How do dates, locations and phone numbers work?",
  "faq.a7": "Every record has the same layout: title, a row of property chips, then your text. Tap a chip such as “Due date” or “Location” to set it in a small panel above the keyboard.",
  "faq.q8": "Can I swipe to complete or delete?",
  "faq.a8": "On phones, swipe a list row or task to the right to complete or favourite it, and to the left to move it to the trash. Undo is offered right away.",
  "faq.q9": "Who can read my records?",
  "faq.a9": "Only you. Database rules allow each account to read its own rows only. We never sell data, show ads or train AI on your writing.",
  "faq.q10": "Why can’t I attach images?",
  "faq.a10": "Kept is deliberately text-only. It keeps the app fast and private and keeps running costs low enough to stay free. Your profile photo is the one exception, stored as a tiny thumbnail.",
  "faq.q11": "How do I back up or move my data?",
  "faq.a11": "Settings → Data & privacy → Export (JSON for a full backup, CSV for spreadsheets). Restoring from JSON adds records and never overwrites existing ones.",
  "faq.q12": "What happens to deleted records?",
  "faq.a12": "They stay in the Trash for 30 days so you can restore them, then they’re deleted permanently.",
  "faq.q13": "How do contributions work?",
  "faq.a13": "Choose one-time or monthly and an amount ($1, $3, $5, $7 or your own). Payment is handled securely by our payment provider; Kept never sees your card.",
  "faq.q14": "How do I cancel a monthly contribution?",
  "faq.a14": "Use “Manage or cancel” on the Support page or the link in your receipt email. Cancelling doesn’t change anything you can do in Kept.",
  "faq.q15": "How do I delete my account?",
  "faq.a15": "Settings → Data & privacy → Delete account. Your login, records, settings and support history are removed immediately; provider backups expire within 30 days.",

  'legal.privacy': 'Privacy Policy', 'legal.terms': 'Terms of Service', 'legal.template': 'Template — the operator must review and complete this before launch.', 'legal.operatorPh': '[Operator name]', 'legal.contactPh': '[privacy contact email]',
  'legal.p1': 'Who we are', 'legal.p1Body': 'Kept is operated by {op}. Contact {contact} with any privacy question or request.',
  'legal.p2': 'What we store', 'legal.p2Body': 'Your email address, password hash (handled by our authentication provider), the records, categories and settings you create, and — if you contribute — the amount, date and status reported by the payment provider. We do not store images (except an optional small profile photo), and we do not collect your location, device contacts or analytics about what you write. If you choose a city for weather, your device asks Open-Meteo for that city’s weather; no device location is used.',
  'legal.p3': 'How we use it', 'legal.p3Body': 'Only to run Kept: storing and syncing your records, signing you in and sending account emails. Your records are never used for advertising, sold, shared with data brokers, or used to train AI.',
  'legal.p4': 'Where it lives', 'legal.p4Body': 'Records are stored with our database provider (Supabase) and protected by row-level security so only your account can read them. Data is encrypted in transit (HTTPS) and at rest by the provider.',
  'legal.p5': 'Your controls', 'legal.p5Body': 'You can export all records (JSON/CSV), delete individual records, empty the trash, delete all records, or delete your account from Settings at any time.',
  'legal.p6': 'Deletion', 'legal.p6Body': 'Trashed records are permanently deleted after {days} days. Deleting your account removes your login, records, settings and support history immediately; provider backups expire within {days} days.',
  'legal.p7': 'Changes', 'legal.p7Body': 'We’ll announce material changes in the app before they take effect.',

  "faq.a10": "Kept는 의도적으로 텍스트만 다뤄요. 그래야 빠르고 안전하며, 무료로 유지할 만큼 운영비가 낮아요. 프로필 사진만 아주 작은 크기로 예외적으로 저장해요.",
  "faq.q11": "백업하거나 데이터를 옮기려면?",
  "faq.a11": "설정 → 데이터·개인정보 → 내보내기 (전체 백업은 JSON, 스프레드시트는 CSV). JSON으로 복원하면 기록이 추가될 뿐 기존 기록을 덮어쓰지 않아요.",
  "faq.q12": "삭제한 기록은 어떻게 되나요?",
  "faq.a12": "30일 동안 휴지통에 남아 복원할 수 있고, 이후 영구 삭제돼요.",
  "faq.q13": "후원은 어떻게 하나요?",
  "faq.a13": "일회성 또는 매월을 고르고 금액($1, $3, $5, $7 또는 직접 입력)을 정하세요. 결제는 결제 서비스에서 안전하게 처리되며 Kept는 카드 정보를 볼 수 없어요.",
  "faq.q14": "정기 후원은 어떻게 해지하나요?",
  "faq.a14": "후원 페이지의 “관리 및 해지”나 영수증 이메일의 링크에서 해지할 수 있어요. 해지해도 Kept 사용에는 아무 변화가 없어요.",
  "faq.q15": "계정은 어떻게 삭제하나요?",
  "faq.a15": "설정 → 데이터·개인정보 → 계정 삭제. 로그인 정보, 기록, 설정, 후원 내역이 즉시 삭제되고, 제공업체 백업은 30일 이내에 만료돼요.",

/* ---------- Local database (IndexedDB with in-memory fallback) ---------- */
class LocalDB {
  constructor(ns) { this.ns = ns; this.name = 'kept-' + ns; this.mem = null; }
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');

        const r = indexedDB.open(this.name, 1);
        r.onupgradeneeded = () => { const db = r.result; ['entries', 'categories', 'kv'].forEach(s => db.objectStoreNames.contains(s) || db.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' })); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { console.warn('IndexedDB unavailable, using memory store', e); this.mem = { entries: new Map(), categories: new Map(), kv: new Map() }; this.volatile = true; }
    return this;
  }
  _tx(store, mode, fn) {
    if (this.mem) return Promise.resolve(fn(null));
    return new Promise((res, rej) => { const tx = this.db.transaction(store, mode); const st = tx.objectStore(store); let out; Promise.resolve(fn(st)).then(v => out = v); tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  }
  async all(store) {
    if (this.mem) return [...this.mem[store].values()].map(x => structuredClone(x));
    return this._tx(store, 'readonly', st => new Promise(r => { const q = st.getAll(); q.onsuccess = () => r(q.result); }));
  }
  async putMany(store, items) {
    if (!items.length) return;
    if (this.mem) { items.forEach(i => this.mem[store].set(i.id ?? i.k, structuredClone(i))); return; }
    return this._tx(store, 'readwrite', st => { items.forEach(i => st.put(i)); });
  }
  put(store, item) { return this.putMany(store, [item]); }
  async del(store, id) { if (this.mem) { this.mem[store].delete(id); return; } return this._tx(store, 'readwrite', st => st.delete(id)); }
  async delMany(store, ids) { if (this.mem) { ids.forEach(i => this.mem[store].delete(i)); return; } return this._tx(store, 'readwrite', st => ids.forEach(i => st.delete(i))); }
  async get(k, d) { if (this.mem) return this.mem.kv.has(k) ? this.mem.kv.get(k).v : d; const r = await this._tx('kv', 'readonly', st => new Promise(r => { const q = st.get(k); q.onsuccess = () => r(q.result); })); return r ? r.v : d; }

}

/* ---------- HTML sanitizer (allowlist) — all rich text passes through here ---------- */
const SAFE = {
  tags: new Set(['P','DIV','BR','B','STRONG','I','EM','U','S','STRIKE','DEL','SPAN','MARK','UL','OL','LI','BLOCKQUOTE','H2','H3']),
  drop: new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','TEMPLATE','SVG','MATH','IMG','VIDEO','AUDIO','CANVAS','FORM','INPUT','BUTTON','SELECT','TEXTAREA','NOSCRIPT','TITLE','HEAD','PICTURE','SOURCE','FRAME','FRAMESET','APPLET','BASE']),
  cls: /^(c-(gray|red|orange|amber|green|teal|blue|violet|pink)|hl-(yellow|orange|green|blue|pink|violet)|bg-(yellow|orange|green|blue|pink|violet)|fs-(s|l|xl)|ico)$/
};
function sanitizeHTML(html) {

    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { ch.remove(); return; }
      const tag = ch.tagName;
      if (SAFE.drop.has(tag)) { ch.remove(); return; }
      if (tag === 'H1' || tag === 'H4' || tag === 'H5' || tag === 'H6') { const h = doc.createElement(tag === 'H1' ? 'h2' : 'h3'); while (ch.firstChild) h.appendChild(ch.firstChild); ch.replaceWith(h); walk(h); return; }
      if (!SAFE.tags.has(tag)) { walk(ch); ch.replaceWith(...ch.childNodes); return; }
      const ico = ch.getAttribute('data-ico');
      const classes = (ch.getAttribute('class') || '').split(/\s+/).filter(c => SAFE.cls.test(c));
      [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
      if (tag === 'SPAN' && classes.includes('ico')) {
        if (ico && ICONS[ico]) { ch.textContent = ''; ch.setAttribute('class', 'ico'); ch.setAttribute('data-ico', ico); } else ch.remove();
        return;
      }
      if (classes.length) ch.setAttribute('class', classes.join(' '));
      walk(ch);
      if ((tag === 'SPAN') && !ch.attributes.length) ch.replaceWith(...ch.childNodes);
    });
  };
  walk(doc.body);
  return doc.body.innerHTML.slice(0, LIMITS.entryChars);
}
function hydrateIcons(root) {
  $$('span.ico[data-ico]', root).forEach(s => { s.setAttribute('contenteditable', 'false'); s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.dataset.ico] || ''}</svg>`; });

}
function htmlToText(html) {
  const d = document.createElement('div'); d.innerHTML = html || '';
  let out = '';
  const block = /^(P|DIV|LI|BLOCKQUOTE|H2|H3|UL|OL)$/;
  const rec = n => {
    n.childNodes.forEach(c => {
      if (c.nodeType === 3) out += c.nodeValue;
      else if (c.nodeType === 1) {
        if (c.tagName === 'BR') { out += '\n'; return; }
        if (block.test(c.tagName) && out && !out.endsWith('\n')) out += '\n';
        if (c.tagName === 'LI') out += (c.parentNode.tagName === 'OL' ? ([...c.parentNode.children].indexOf(c) + 1) + '. ' : '• ');
        rec(c);
        if (block.test(c.tagName) && !out.endsWith('\n')) out += '\n';

  };
  rec(d);

}
function htmlToMarkdown(html) {
  const d = document.createElement('div'); d.innerHTML = html || '';
  const inl = n => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.nodeValue.replace(/([*_~`])/g, '\\$1');
    if (c.nodeType !== 1) return '';
    const s = inl(c);
    switch (c.tagName) {
      case 'B': case 'STRONG': return s.trim() ? `**${s}**` : s;
      case 'I': case 'EM': return s.trim() ? `*${s}*` : s;
      case 'S': case 'STRIKE': case 'DEL': return s.trim() ? `~~${s}~~` : s;
      case 'MARK': return s.trim() ? `==${s}==` : s;
      case 'BR': return '  \n';
      case 'SPAN': return c.classList.contains('ico') ? `:${c.dataset.ico}:` : s;
      default: return s;
    }
  }).join('');
  const blk = n => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.nodeValue.trim() ? c.nodeValue + '\n\n' : '';
    if (c.nodeType !== 1) return '';
    switch (c.tagName) {
      case 'UL': return [...c.children].map(li => `- ${inl(li)}`).join('\n') + '\n\n';
      case 'OL': return [...c.children].map((li, i) => `${i + 1}. ${inl(li)}`).join('\n') + '\n\n';
      case 'BLOCKQUOTE': return inl(c).split('\n').map(l => '> ' + l).join('\n') + '\n\n';
      case 'H2': return '## ' + inl(c) + '\n\n';
      case 'H3': return '### ' + inl(c) + '\n\n';
      case 'P': case 'DIV': return inl(c) + '\n\n';
      default: return inl(c);
    }

}

/* ---------- Micro-interactions ---------- */
function burst(el, n = 8, colors) {
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(); if (!r.width) return; const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cs = colors || ['var(--accent)', 'var(--dot)', '#ffd166', '#5ee29a', '#6fa8ff'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('i'); d.className = 'burst'; const a = (Math.PI * 2 * i) / n + Math.random() * .5; const dist = 16 + Math.random() * 18;
    d.style.cssText = `left:${cx}px;top:${cy}px;background:${cs[i % cs.length]};--dx:${(Math.cos(a) * dist).toFixed(1)}px;--dy:${(Math.sin(a) * dist).toFixed(1)}px`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 700);
  }
}

/* =====================================================================
   SYNC — local-first with version-checked writes & tombstones
   ===================================================================== */
const ENTRY_COLS = 'id,type,title,content,content_text,category_id,tags,favorite,pinned,meta,created_at,client_updated_at,deleted_at,version,updated_at';
const toRow = e => ({ id: e.id, type: e.type, title: e.title, content: e.content, content_text: e.text, category_id: e.category_id, tags: e.tags, favorite: e.favorite,
  pinned: e.pinned, meta: e.meta, created_at: e.created_at, client_updated_at: e.updated_at, deleted_at: e.deleted_at });
const fromRow = r => ({ id: r.id, type: r.type, title: r.title || '', content: sanitizeHTML(r.content || ''), text: r.content_text || '', category_id: r.category_id, tags: r.tags || [],
  favorite: !!r.favorite, pinned: !!r.pinned, meta: r.meta || {}, created_at: r.created_at, updated_at: r.client_updated_at || r.updated_at, deleted_at: r.deleted_at, _sv: r.version, _dirty: false });
const catToRow = c => ({ id: c.id, name: c.name, color: c.color, sort: c.sort || 0, created_at: c.created_at, client_updated_at: c.updated_at });
const catFromRow = r => ({ id: r.id, name: r.name, color: r.color, sort: r.sort, created_at: r.created_at, updated_at: r.client_updated_at || r.updated_at, _sv: r.version, _dirty: false });

const Sync = {
  sb: null, timer: null, prefsTimer: null, running: false, again: false,
  set(state) { S.sync = state; emit('sync'); },
  schedule(ms = 1200) { if (S.mode !== 'cloud') return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  schedulePrefs() { if (S.mode !== 'cloud') return; clearTimeout(this.prefsTimer); this.prefsTimer = setTimeout(() => this.pushPrefs(), 1500); },
  async run() {
    if (S.mode !== 'cloud') return;
    if (!this.sb) { this.set('offline'); return; }
    if (!navigator.onLine) { this.set('offline'); return; }
    if (this.running) { this.again = true; return; }
    this.running = true; this.set('syncing');
    try {
      await this.pushDeletes();
      await this.pushCategories();
      await this.pushEntries();
      await this.pull();
      S.lastSyncAt = nowISO(); await S.db.set('lastSyncAt', S.lastSyncAt);
      this.set([...S.entries.values()].some(e => e._dirty) ? 'error' : 'synced');
    } catch (err) {
      console.warn('sync failed', err);
      this.set(navigator.onLine ? 'error' : 'offline');
      this.lastError = err?.message || String(err);
      if (/JWT|token|auth/i.test(this.lastError)) { await this.sb.auth.refreshSession().catch(() => {}); }
    } finally {
      this.running = false;
      if (this.again) { this.again = false; this.schedule(400); }
    }
  },
  async pushDeletes() {
    const pend = await S.db.get('pendingDeletes', []); if (!pend.length) return;
    for (const table of ['entries', 'categories']) {
      const ids = pend.filter(p => p.table === table).map(p => p.id); if (!ids.length) continue;
      for (let i = 0; i < ids.length; i += 200) { const { error } = await this.sb.from(table).delete().in('id', ids.slice(i, i + 200)); if (error) throw error; }
    }
    await S.db.set('pendingDeletes', []);
  },
  async pushCategories() {
    const dirty = [...S.categories.values()].filter(c => c._dirty);
    for (const c of dirty) {
      if (c._sv == null) {
        const { data, error } = await this.sb.from('categories').upsert(catToRow(c), { onConflict: 'id', ignoreDuplicates: false }).select('version').single();
        if (error) throw error; c._sv = data.version;
      } else {
        const { data, error } = await this.sb.from('categories').update(catToRow(c)).eq('id', c.id).select('version');
        if (error) throw error; c._sv = data[0]?.version ?? c._sv; // categories: last-write-wins (names/colors)
      }
      c._dirty = false; await S.db.put('categories', c);
    }
  },
  async pushEntries() {
    const dirty = [...S.entries.values()].filter(e => e._dirty);
    const fresh = dirty.filter(e => e._sv == null), upd = dirty.filter(e => e._sv != null);
    for (let i = 0; i < fresh.length; i += 100) {
      const chunk = fresh.slice(i, i + 100); const stamps = new Map(chunk.map(e => [e.id, e.updated_at]));
      const { data, error } = await this.sb.from('entries').insert(chunk.map(toRow)).select('id,version');
      if (error) {
        if (error.code === '23505') { for (const e of chunk) await this.pushOne(e); continue; }
        if (/limit/i.test(error.message)) toast(t('err.quota'), { error: true });
        throw error;
      }
      const vm = new Map(data.map(r => [r.id, r.version]));
      chunk.forEach(e => { if (vm.has(e.id)) { e._sv = vm.get(e.id); if (S.entries.get(e.id) === e && e.updated_at === stamps.get(e.id)) e._dirty = false; } });
      await S.db.putMany('entries', chunk);
    }
    for (const e of upd) await this.pushOne(e);
  },
  async pushOne(e) {
    const snapshotUpdated = e.updated_at;
    if (e._sv == null) {
      const { data: ex } = await this.sb.from('entries').select(ENTRY_COLS).eq('id', e.id).maybeSingle();
      if (ex) { await this.conflict(e, ex); return; }
      const { data, error } = await this.sb.from('entries').insert(toRow(e)).select('version').single();
      if (error) throw error; e._sv = data.version;
    } else {
      const { data, error } = await this.sb.from('entries').update(toRow(e)).eq('id', e.id).eq('version', e._sv).select('version');
      if (error) throw error;
      if (!data.length) {
        const { data: ex, error: e2 } = await this.sb.from('entries').select(ENTRY_COLS).eq('id', e.id).maybeSingle();
        if (e2) throw e2;
        if (!ex) { e._sv = null; return this.pushOne(e); } // deleted remotely → recreate local work
        await this.conflict(e, ex); return;
      }
      e._sv = data[0].version;
    }
    if (e.updated_at === snapshotUpdated) e._dirty = false;
    await S.db.put('entries', e);
  },
  /* Never silently overwrite: server copy wins the original id, local edits are kept as a separate copy. */
  async conflict(local, serverRow) {
    const server = fromRow(serverRow);
    const sameContent = server.title === local.title && server.content === local.content && JSON.stringify(server.meta) === JSON.stringify(local.meta);
    if (sameContent) { local._sv = server._sv; local._dirty = false; await S.db.put('entries', local); return; }
    const copy = Object.assign(structuredClone(local), { id: uid(), _sv: null, _dirty: true, title: (local.title || entryDisplayTitle(local)) + ' ' + t('sync.conflictSuffix'), created_at: nowISO() });
    S.entries.set(server.id, server); S.entries.set(copy.id, copy);
    await S.db.putMany('entries', [server, copy]);
    Editor.onExternalChange(server.id);
    this.again = true; // push the conflict copy in the next pass
    toast(t('sync.conflict'), { action: t('common.open'), onAction: () => Editor.open(copy.id), ms: 8000 });
    emit('entries');
  },
  async pull() {
    let cursor = await S.db.get('pullCursor', '1970-01-01T00:00:00Z');
    // categories (small)
    const { data: cats, error: ce } = await this.sb.from('categories').select('id,name,color,sort,created_at,client_updated_at,updated_at,version').gt('updated_at', cursor);
    if (ce) throw ce;
    const catPut = [];
    cats.forEach(r => { const l = S.categories.get(r.id); if (l && l._dirty) return; const c = catFromRow(r); S.categories.set(c.id, c); catPut.push(c); });
    await S.db.putMany('categories', catPut);
    let maxCur = cursor; cats.forEach(r => { if (r.updated_at > maxCur) maxCur = r.updated_at; });
    // entries, paginated
    let changed = catPut.length > 0;
    // small overlap guards against rows committed slightly out of order; re-reading a row is harmless
    let since = new Date(new Date(cursor).getTime() - 10000).toISOString();
    for (let page = 0; page < 200; page++) {
      const { data, error } = await this.sb.from('entries').select(ENTRY_COLS).gt('updated_at', since).order('updated_at', { ascending: true }).limit(500);
      if (error) throw error;
      if (!data.length) break;
      const put = [];
      for (const r of data) {
        const l = S.entries.get(r.id);
        if (l && l._dirty) { if (l._sv !== r.version) await this.conflict(l, r); continue; }
        if (l && l._sv === r.version) continue;
        const e = fromRow(r); S.entries.set(e.id, e); put.push(e); Editor.onExternalChange(e.id);
      }
      await S.db.putMany('entries', put); changed = changed || put.length > 0;
      cursor = since = data[data.length - 1].updated_at; if (cursor > maxCur) maxCur = cursor;
      if (data.length < 500) break;
    }
    // tombstones
    const tombSince = await S.db.get('tombCursor', '1970-01-01T00:00:00Z');
    const { data: tomb, error: te } = await this.sb.from('deleted_records').select('record_id,table_name,deleted_at').gt('deleted_at', tombSince).order('deleted_at').limit(5000);
    if (te) throw te;
    if (tomb.length) {
      const eIds = tomb.filter(x => x.table_name === 'entries').map(x => x.record_id).filter(id => S.entries.has(id) && !S.entries.get(id)._dirty);
      const cIds = tomb.filter(x => x.table_name === 'categories').map(x => x.record_id).filter(id => S.categories.has(id));
      eIds.forEach(id => S.entries.delete(id)); cIds.forEach(id => S.categories.delete(id));
      await S.db.delMany('entries', eIds); await S.db.delMany('categories', cIds);
      await S.db.set('tombCursor', tomb[tomb.length - 1].deleted_at); changed = changed || eIds.length || cIds.length;
    }
    await S.db.set('pullCursor', maxCur > cursor ? maxCur : cursor);
    if (changed) { emit('entries'); emit('categories'); Reminders.reschedule(); }
  },
  async pullPrefs() {
    const { data, error } = await this.sb.from('user_settings').select('prefs,updated_at').maybeSingle();
    if (error || !data) return;
    const localAt = await S.db.get('prefsAt', '1970');
    if (data.updated_at > localAt && data.prefs) { const keep = { lang: S.prefs.lang }; Object.assign(S.prefs, DEFAULT_PREFS, data.prefs); if (!data.prefs.lang) S.prefs.lang = keep.lang; ls.set('kept.prefs', S.prefs); applyPrefs(); emit('prefs'); }
  },
  async pushPrefs() {
    if (S.mode !== 'cloud' || !this.sb || !navigator.onLine) return;
    const at = nowISO(); await S.db.set('prefsAt', at);
    const { error } = await this.sb.from('user_settings').upsert({ user_id: S.user.id, prefs: S.prefs, updated_at: at }, { onConflict: 'user_id' });
    if (error) console.warn('prefs sync', error);
  }
};

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }

/* ---------- Reminders (honest: only while the app is open, via Notification API) ---------- */
const Reminders = {
  timers: [],
  supported: () => 'Notification' in window,
  permission: () => ('Notification' in window ? Notification.permission : 'unsupported'),
  async request() { if (!this.supported()) return 'unsupported'; const p = await Notification.requestPermission(); savePrefs({ notify: p === 'granted' }); this.reschedule(); return p; },
  upcoming(hours = 24) {
    const now = Date.now(), lim = now + hours * 3600e3, out = [];
    live().forEach(e => {
      let at = null, when = null;
      if (e.type === 'event' && e.meta.date && e.meta.remind != null && e.meta.remind !== '') {
        const tm = e.meta.time || '09:00'; const span = Math.ceil(hours / 24) + 2;
        const dks = e.meta.repeat ? [...Array(span)].map((_, i) => dayKey(addDays(new Date(), i))).filter(dk => occursOn(e, dk)) : [e.meta.date];
        dks.forEach(dk => { const w = new Date(`${dk}T${tm}`).getTime(), a = w - Number(e.meta.remind) * 60e3; if (a > now - 1000 && a < lim) out.push({ e, at: a, when: w }); });
        return;
      } else if (e.type === 'todo' && !e.meta.done && e.meta.due && e.meta.remind != null && e.meta.remind !== '') {
        const tm = e.meta.due_time || '09:00'; when = new Date(`${e.meta.due}T${tm}`).getTime(); at = when - Number(e.meta.remind) * 60e3;
      }
      if (at && at > now - 1000 && at < lim) out.push({ e, at, when });
    });
    return out.sort((a, b) => a.at - b.at);
  },
  reschedule: debounce(function () {
    Reminders.timers.forEach(clearTimeout); Reminders.timers = [];
    if (!S.prefs.notify || Reminders.permission() !== 'granted') return;
    Reminders.upcoming(24).forEach(({ e, at, when }) => {
      const key = `kept.fired.${e.id}.${at}`;
      if (ls.get(key)) return;
      Reminders.timers.push(setTimeout(() => { ls.set(key, 1); Reminders.fire(e, when); }, Math.max(0, at - Date.now())));
    });
  }, 500),
  async fire(e, when) {
    const body = `${fmtDate(new Date(when), { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
    const opts = { body, tag: e.id, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: { id: e.id } };
    try {
      const reg = await navigator.serviceWorker?.getRegistration?.();
      if (reg) reg.showNotification(entryDisplayTitle(e), opts); else new Notification(entryDisplayTitle(e), opts);
    } catch { toast(entryDisplayTitle(e) + ' · ' + body); }
  }
};

/* ---- rich.js ---- */
/* =====================================================================
   RICH — inline formatting engine.
   Each block ("container") is read as a flat list of runs {text, marks},
   marks are changed on exact character ranges, and the block is re-rendered
   with clean, canonical markup. With a collapsed caret a zero-width "pending"
   run carries the chosen style, so the very next keystroke (IME included)
   is typed with it — format first, type second.
   ===================================================================== */
const ZW = '​', ZWRE = /​/g;
const BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'UL', 'OL', 'BLOCKQUOTE', 'H2', 'H3']);

/* ---- extras.js ---- */
/* =====================================================================
   EXTRAS — weather (Open-Meteo, no key, cached), aurora palettes,
   rotating prompts. Everything here is client-side; the only network
   call is one tiny weather request per hour, and only after the user
   allows location.
   ===================================================================== */

/* ---------- Aurora palettes (pure CSS animation, zero traffic) ---------- */
const AURORAS = ['sunset', 'ocean', 'forest', 'dusk', 'rose', 'storm', 'snow', 'night'];
const Aurora = {
  current: null,
  pick() {
    const pref = S.prefs.aurora || 'auto';
    if (pref !== 'auto' && AURORAS.includes(pref)) return pref;
    const w = Weather.data && Weather.fresh(6 * 3600e3) ? Weather.data : null;
    if (w) return Weather.palette(w);
    if (!this.current) this.current = ['sunset', 'ocean', 'forest', 'dusk', 'rose'][Math.floor(Math.random() * 5)];
    return this.current;
  },
  next() { // the refresh button on the card
    const order = AURORAS; const cur = this.pick(); this.current = order[(order.indexOf(cur) + 1) % order.length];
    if ((S.prefs.aurora || 'auto') !== 'auto') savePrefs({ aurora: this.current });
    else this.override = this.current;
    return this.current;
  },
  name() { return this.override || this.pick(); },
  attr() { return `data-au="${this.name()}"`; },
  layers: '<span class="au-l" aria-hidden="true"></span>'
};
/* pause the drift while a card is off-screen (no wasted frames) */
const auObserver = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('au-paused', !e.isIntersecting))) : null;
function watchAuroras(root = document) { if (auObserver) $$('.aurora', root).forEach(n => auObserver.observe(n)); }

/* ---------- Questions: rotate quietly while the card is visible ---------- */
const PROMPT_COUNT = 48;
const Prompts = {
  order: null, i: 0, timer: null,
  shuffle() { const a = [...Array(PROMPT_COUNT).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } this.order = a; this.i = 0; },
  current() { if (!this.order) this.shuffle(); return t('prompt.' + this.order[this.i % PROMPT_COUNT]); },
  kicker() { return t('cap.k' + (this.order ? this.order[this.i % PROMPT_COUNT] % 6 : 0)); },
  advance() { if (!this.order) this.shuffle(); this.i++; if (this.i >= PROMPT_COUNT) this.shuffle(); },
  start() {
    this.stop();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.timer = setInterval(() => {
      const h = $('.capture .cap-q'); if (!h || document.hidden || Editor.e) return;
      if (h.closest('.capture')?.matches(':hover')) return;
      this.advance(); Prompts.swap();
    }, 9000);
  },
  swap() {
    const h = $('.capture .cap-q'), k = $('.capture .cap-k'); if (!h) return;
    h.classList.add('out'); k?.classList.add('out');
    setTimeout(() => { h.textContent = this.current(); if (k) k.textContent = this.kicker(); h.classList.remove('out'); k?.classList.remove('out'); }, 380);
  },
  stop() { clearInterval(this.timer); this.timer = null; }
};

/* ---------- Weather ---------- */
const WMO = c => c === 0 ? 'clear' : c <= 2 ? 'partly' : c === 3 ? 'cloudy' : c <= 48 ? 'fog' : c <= 57 ? 'drizzle' : c <= 67 ? 'rain' : c <= 77 ? 'snow' : c <= 82 ? 'rain' : c <= 86 ? 'snow' : 'thunder';
const Weather = {
  data: ls.get('kept.weather', null),
  busy: false,
  city() { return cityLookup(S.prefs.wxCity); },
  enabled() { return !!this.city(); },
  fresh(ms = 50 * 60e3) { return !!(this.data && this.data.city === S.prefs.wxCity && Date.now() - this.data.at < ms); },
  kind(w = this.data) { return w ? WMO(w.code) : null; },
  icon(w = this.data) {
    const k = this.kind(w), day = w?.isDay !== 0;
    return { clear: day ? 'sun' : 'moon', partly: day ? 'cloud-sun' : 'cloud-moon', cloudy: 'cloud', fog: 'cloud-fog', drizzle: 'cloud-drizzle', rain: 'cloud-rain', snow: 'cloud-snow', thunder: 'cloud-lightning' }[k] || 'cloud';
  },
  palette(w) {
    const k = this.kind(w), day = w.isDay !== 0;
    if (!day && (k === 'clear' || k === 'partly')) return 'night';

async function captureToEntry(input, ty) {
  const raw = input.trim(); if (!raw) return null;
  const lines = raw.split('\n'); const first = lines[0].trim();
  const para = s => s.split('\n').map(l => `<p>${esc(l) || '<br>'}</p>`).join('');
  const rest = lines.length > 1 ? para(lines.slice(1).join('\n')) : '';
  let e;
  if (ty === 'todo') e = newEntry({ type: 'todo', title: first.slice(0, 300), content: rest, meta: { done: false, priority: 0, due: V.selDay !== todayKey() ? V.selDay : '' } });
  else if (ty === 'event') e = newEntry({ type: 'event', title: first.slice(0, 300), content: rest, meta: { date: V.selDay, time: '' } });
  else if (ty === 'item') { const m = first.match(/^(.+?)\s*(?:[:：=→]|->| - )\s*(.+)$/); e = newEntry({ type: 'item', title: (m ? m[1] : first).slice(0, 300), meta: { location: m ? m[2] : '' }, content: rest }); }
  else if (ty === 'contact') {
    const phone = raw.match(/\+?[\d][\d\s().-]{6,}\d/)?.[0] || ''; const email = raw.match(/[^\s@]+@[^\s@]+\.[^\s@]+/)?.[0] || '';
    const name = first.replace(phone, '').replace(email, '').replace(/[,;]/g, ' ').trim() || first;
    e = newEntry({ type: 'contact', title: name.slice(0, 300), meta: { phone, email }, content: rest });
  } else e = newEntry({ type: ty, content: para(raw) });
  e.text = htmlToText(e.content);
  await saveEntry(e);
  return e;
}
async function quickCapture() {
  const ta = $('#capIn'); if (!ta || !ta.value.trim()) { ta?.focus(); return; }
  const box = ta.closest('.cap-box'); const send = box.querySelector('.send');
  box.classList.add('sent'); burst(send, 10); haptic(15);
  const ty = V.capType; const e = await captureToEntry(ta.value, ty);
  setTimeout(() => { ta.value = ''; ta.style.height = ''; box.classList.remove('sent'); }, 380);
  if (!e) return; UI.flash(e.id);
  toast(t('cap.saved', { type: typeOf(ty).label }), { action: t('common.open'), onAction: () => Editor.open(e.id) });
}

/* ---------- swipe rows (phones): right = done / favourite, left = trash ---------- */
function bindSwipe() {
  let sw = null, lastSwipe = 0;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || S.selecting) return; const w = e.target.closest('.sw-wrap'); if (!w) return;
    sw = { w, el: w.lastElementChild, x0: e.clientX, y0: e.clientY, dx: 0, on: false };
  }, { passive: true });
  document.addEventListener('pointermove', e => {
    if (!sw) return; const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.on) { if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) { sw.on = true; sw.w.classList.add('swiping'); } else if (Math.abs(dy) > 10) { sw = null; return; } else return; }
    sw.dx = dx; const d = Math.sign(dx) * Math.min(Math.abs(dx), 160) + (Math.abs(dx) > 160 ? (dx - Math.sign(dx) * 160) * .25 : 0);
    sw.el.style.transform = `translateX(${d}px)`; sw.w.dataset.dir = dx > 0 ? 'l' : 'r';
    const armed = Math.abs(dx) > 90; if (armed !== sw.w.classList.contains('armed')) { sw.w.classList.toggle('armed', armed); if (armed) haptic(8); }
  }, { passive: true });
  const end = async () => {
    if (!sw) return; const { w, el, dx, on } = sw; sw = null; if (!on) return;
    lastSwipe = Date.now(); w.classList.remove('swiping', 'armed'); el.style.transition = 'transform .28s var(--ease)';
    const id = w.dataset.sw, kind = w.dataset.kind; const e = S.entries.get(id);
    if (Math.abs(dx) <= 90 || !e) { el.style.transform = ''; setTimeout(() => el.style.transition = '', 300); return; }
    if (dx < 0) {
      el.style.transform = 'translateX(-110%)'; w.style.height = w.offsetHeight + 'px'; requestAnimationFrame(() => { w.classList.add('collapse'); });
      setTimeout(async () => { await trashEntries([id]); toast(t('trash.moved'), { action: t('common.undo'), onAction: () => restoreEntries([id]) }); }, 280);
    } else if (kind === 'task') {
      el.style.transform = ''; e.meta.done = !e.meta.done; e.meta.done_at = e.meta.done ? nowISO() : null; el.classList.toggle('done', e.meta.done); el.querySelector('.chk')?.classList.toggle('on', e.meta.done);
      if (e.meta.done) burst(el.querySelector('.chk'), 10); haptic(15); await saveEntry(e, { silent: true }); setTimeout(rerender, 420);
    } else { el.style.transform = ''; e.favorite = !e.favorite; const h = el.querySelector('.heart'); h?.classList.toggle('on', e.favorite); if (e.favorite) burst(h, 8, ['var(--dot)', '#ff86c8']); haptic(10); await saveEntry(e, { silent: true }); setTimeout(rerender, 350); }
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', () => { if (sw) { sw.el.style.transform = ''; sw.w.classList.remove('swiping', 'armed'); sw = null; } });
  document.addEventListener('click', e => { if (Date.now() - lastSwipe < 400 && e.target.closest('.sw-wrap')) { e.stopPropagation(); e.preventDefault(); } }, true);
}
/* horizontal swipe to move weeks (Today) and months/weeks (Calendar) — touch and mouse */
function bindPager() {
  let p = null, lastPage = 0;
  document.addEventListener('pointerdown', e => {
    const host = e.target.closest('#weekStrip, #calGrid'); if (!host || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const track = host.id === 'weekStrip' ? host.querySelector('.wk-track') : host.firstElementChild?.classList.contains('cal-head') ? host.querySelector('.cal-grid') : host.firstElementChild;
    p = { host, track, x0: e.clientX, y0: e.clientY, dx: 0, on: false };
  }, { passive: true });
  document.addEventListener('pointermove', e => {
    if (!p) return; const dx = e.clientX - p.x0, dy = e.clientY - p.y0;
    if (!p.on) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) p.on = true; else if (Math.abs(dy) > 12) { p = null; return; } else return; }
    p.dx = dx; p.track.style.transition = 'none'; p.track.style.transform = `translateX(${dx * .55}px)`; p.track.style.opacity = String(1 - Math.min(.5, Math.abs(dx) / 500));
  }, { passive: true });
  const end = () => {
    if (!p) return; const { host, track, dx, on } = p; p = null; if (!on) return;
    lastPage = Date.now(); track.style.transition = 'transform .22s var(--ease), opacity .22s'; 
    if (Math.abs(dx) < 50) { track.style.transform = ''; track.style.opacity = ''; return; }
    const dir = dx < 0 ? 1 : -1; track.style.transform = `translateX(${-dir * 40}%)`; track.style.opacity = '0'; haptic(6);
    setTimeout(() => { if (host.id === 'weekStrip') ACT.wk({ dataset: { d: String(dir * 7) } }); else ACT.calNav({ dataset: { d: String(dir) } }); }, 140);
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', () => { if (p) { p.track.style.transform = ''; p.track.style.opacity = ''; p = null; } });
  document.addEventListener('click', e => { if (Date.now() - lastPage < 350 && e.target.closest('#weekStrip, #calGrid')) { e.stopPropagation(); e.preventDefault(); } }, true);
}
/* hide the floating dock while the keyboard is up, so it never sits on top of what you type */
function bindKeyboardChrome() {
  const editable = n => n && (n.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(n.tagName)) && !['checkbox', 'radio', 'button', 'color', 'date', 'time'].includes(n.type);
  document.addEventListener('focusin', e => { if (isTouch() && editable(e.target)) document.documentElement.classList.add('typing-any'); });
  document.addEventListener('focusout', () => setTimeout(() => { if (!editable(document.activeElement)) document.documentElement.classList.remove('typing-any'); }, 60));
}

    if (lg) { savePrefs({ lang: LANG === 'ko' ? 'en' : 'ko' }); showAuth(mode, allowBack); return; }

/* ---------- Session start ---------- */
async function loadNamespace(ns) {
  S.ns = ns; S.db = await new LocalDB(ns).open(); S.volatile = !!S.db.volatile;
  const [ents, cats] = await Promise.all([S.db.all('entries'), S.db.all('categories')]);
  S.entries = new Map(ents.map(e => [e.id, e])); S.categories = new Map(cats.map(c => [c.id, c]));
  const p = await S.db.get('prefs', null); if (p) { Object.assign(S.prefs, p, { lang: S.prefs.lang || p.lang }); applyPrefs(); }
  S.lastSyncAt = await S.db.get('lastSyncAt', null);
  // auto-purge trash older than 30 days
  const lim = Date.now() - 30 * 864e5; const old = [...S.entries.values()].filter(e => e.deleted_at && new Date(e.deleted_at) < lim).map(e => e.id);
  if (old.length) await purgeEntries(old);
}
async function startLocal() {
  S.mode = 'local'; S.user = null; await loadNamespace('local'); S.sync = 'local';
  enterApp();
  if (S.volatile) toast(t('err.noStorage'), { error: true, ms: 7000 });
}
async function startCloud(user, { offline = false } = {}) {
  S.mode = 'cloud'; S.user = { id: user.id, email: user.email }; await loadNamespace(user.id); Sync.set(navigator.onLine && !offline ? 'syncing' : 'offline');
  ls.set('kept.lastUser', S.user); ls.del('kept.mode'); enterApp();
  if (offline) { reconnectLater(); return; }
  Sync.pullPrefs().then(() => render()).catch(() => {});
  await Sync.run();
  // offer to move device-only records into the account
  try { const loc = await new LocalDB('local').open(); const n = (await loc.all('entries')).length; if (n) { const ok = await confirmDlg(t('mig.title'), tn('mig.body', n), t('mig.go')); if (ok) await migrateLocal(loc); } } catch {}
}
async function migrateLocal(loc) {
  loc = loc || await new LocalDB('local').open();
  const [ents, cats] = await Promise.all([loc.all('entries'), loc.all('categories')]);
  cats.forEach(c => { c._dirty = true; c._sv = null; if (!S.categories.has(c.id)) S.categories.set(c.id, c); });
  ents.forEach(e => { e._dirty = true; e._sv = null; if (S.entries.has(e.id)) e.id = uid(); S.entries.set(e.id, e); });
  await S.db.putMany('categories', cats); await S.db.putMany('entries', ents); await loc.destroy();
  emit('entries'); Sync.run(); toast(tn('mig.done', ents.length));
}
/* Signed-in user, but the sync library/server is unreachable (e.g. offline cold start): keep working locally and reconnect. */
let reconnecting = false;
function reconnectLater() {
  if (reconnecting) return; reconnecting = true;
  const attempt = async () => {
    if (!navigator.onLine) return;
    try {
      const sb = await getSupabase(); const { data: { session } } = await sb.auth.getSession();
      clearInterval(timer); removeEventListener('online', attempt); reconnecting = false;
      if (session?.user?.id === S.user.id) { Sync.pullPrefs().catch(() => {}); Sync.run(); }
      else showAuth('signin', true, t('auth.sessionExpired'));
    } catch { Sync.sb = null; }
  };
  const timer = setInterval(attempt, 30000); addEventListener('online', attempt); setTimeout(attempt, 1500);
}
function enterApp() {
  $('#auth').hidden = true; applyPrefs(); shell(); applyI18n(); Editor.init(); render();
  Reminders.reschedule(); $('#boot').classList.add('gone'); Weather.auto();
  if (!navigator.onLine) netbar(true);
}

/* ---------- Boot ---------- */
async function boot() {
  applyPrefs(); applyI18n(); bindGlobal();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker?.addEventListener?.('message', e => { if (e.data?.open) { Editor.open(e.data.open); } });
  if (Conn.configured()) {
    try {
      const sb = await getSupabase();
      let recovery = /type=recovery/.test(location.hash);
      sb.auth.onAuthStateChange((ev, session) => {
        if (ev === 'PASSWORD_RECOVERY') { recovery = true; $('#boot').classList.add('gone'); showAuth('newpw'); }
        if (ev === 'SIGNED_OUT' && S.mode === 'cloud') { S.mode = 'local'; }
        if (ev === 'TOKEN_REFRESHED' && S.mode === 'cloud') Sync.schedule(100);
      });
      const { data: { session } } = await sb.auth.getSession();
      if (/access_token|type=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#/today');
      if (recovery) { $('#boot').classList.add('gone'); showAuth('newpw'); return; }
      if (session?.user) return startCloud(session.user);
    } catch (err) {
      console.warn(err);
      const lu = ls.get('kept.lastUser'); if (lu?.id) return startCloud(lu, { offline: true });
      if (ls.get('kept.mode') !== 'local') { $('#boot').classList.add('gone'); showAuth('signin', false, t('err.connFail')); return; }
    }
    if (ls.get('kept.mode') !== 'local') { $('#boot').classList.add('gone'); showAuth('signin'); return; }
  }
  return startLocal();
}
boot();
